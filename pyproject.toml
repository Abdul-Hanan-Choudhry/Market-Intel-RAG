[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Market-intelligence RAG over news, filings and central-bank documents with local GGUF SLMs and hybrid search"
requires-python = ">=3.11,<3.13"

[project.scripts]
rag = "rag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
